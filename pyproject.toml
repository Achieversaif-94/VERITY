[project]
name = "verity"
version = "0.1.0"
description = "Verifiable execution runtime for autonomous AI agents"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
